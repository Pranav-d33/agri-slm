          - generic [ref=f35e116]:
            - heading "About Directorate of Economics & Statistics" [level=2] [ref=f35e117]
            - generic [ref=f35e118]:
              - text: "Directorate of Economics and Statistics (DES), an attached office of the Department of Agriculture, Cooperation and Farmers Welfare (DAC&FW), is headed by Senior Economic & Statistical Adviser. DES collects, disseminates and publishes statistics on diverse facets of agriculture and related sectors required for policy formulation by the Government. The main objective of the Directorate is to provide important statistics on area, production, land use, cost and yield of principal crops, minimum support prices, to implement schemes related to improvement of agricultural statistics, and carrying out agro-economic research as well as generation and dissemination of agricultural statistics and research and analysis. The Directorate provides inputs to DAC&FW, CACP and also places a large volume of data and information in the public domain for use of all researchers and stakeholders. Major Divisions of the DES are : Cost Studies (CS) Special Data Dissemination Standards (SDDS) Commercial Crops (CC) Food Economics (FE) Coordination Prices & Markets (P&M) Indian Agriculture & Compilation (IAC) Crop Forecast Coordination Centre (CFCC) Agro Economic Research (AER) Agricultural statistics (AS) Publications."
              - link "Read More" [ref=f35e119] [cursor=pointer]:
                - /url: https://desagri.gov.in/about-us/profile-of-directorate-of-economics-statistics/
