          - generic [ref=f35e96]:
            - heading "Agricultural Statistics Improvement (ASI)" [level=2] [ref=f35e97]
            - generic [ref=f35e98]:
              - text: Agricultural Statistics Improvement (ASI) Division deals with Improvement of Agricultural Statistics (IAS) Scheme. IAS Scheme is a Central Sector Scheme with 100 percent grants-in-aids to State Implementing Agencies. The basic objective of the Central Sector Scheme is to collect and improve agricultural statistics in the form of area/production/yield rate for the principal agricultural crops. The functions and responsibilities of ASI Division are to implement the scheme in various States/ UTs and monitor its progress physical and financial for efficient and time bound collection of reliable data on area, production and yield of major agricultural crops by States/ UTs.
